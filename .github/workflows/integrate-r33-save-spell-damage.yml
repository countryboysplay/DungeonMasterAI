name: Integrate r33 save-spell player damage

on:
  push:
    branches:
      - feature/r33-player-save-spell-damage
    paths:
      - .github/workflows/integrate-r33-save-spell-damage.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate save-spell damage pipeline
        run: python3 .github/scripts/integrate-r33.py

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@local.invalid"
          git add windows
          git commit -m "r33: integrate player save-spell damage rolls"
          git push origin HEAD:${GITHUB_REF_NAME}
