name: R57 Map Editing

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  map-editing:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run r57 non-destructive map editing tests
        run: dotnet run --project tests/DungeonMasterAI.R57MapEditingTests/DungeonMasterAI.R57MapEditingTests.csproj --configuration Release

      - name: Upload r57 map editing reference
        uses: actions/upload-artifact@v4
        with:
          name: DungeonMasterAI-map-editing-r57
          path: windows/artifacts/r57-map-editing/*.png
