name: Apply r25 player-damage patch

on:
  push:
    branches:
      - feature/r25-player-attack-damage-rolls
    paths:
      - .github/patches/r25-player-damage-rolls.part*
      - .github/workflows/apply-r25-player-damage-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode patch
        shell: bash
        run: |
          cat .github/patches/r25-player-damage-rolls.part* | base64 -d | gzip -d > /tmp/r25.patch

      - name: Verify and apply patch
        shell: bash
        run: |
          git apply --check /tmp/r25.patch
          git apply /tmp/r25.patch

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@local.invalid"
          git add windows
          git commit -m "r25: make player attack damage rolls authoritative"
          git push origin HEAD:${GITHUB_REF_NAME}
