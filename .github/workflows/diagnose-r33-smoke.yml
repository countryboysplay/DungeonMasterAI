name: Diagnose r33 smoke context

on:
  push:
    branches:
      - feature/r33-player-save-spell-damage
    paths:
      - .github/workflows/diagnose-r33-smoke.yml
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show failing assertion context
        shell: bash
        run: |
          grep -n -B 15 -A 20 "upcast damaging spell adds one configured die for each slot above base" windows/tests/DungeonMasterAI.Smoke/Program.cs || true
