name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Source-level gate. Runs on Linux in well under a minute and fails fast on structural
  # problems (malformed XAML/csproj, unbalanced C# delimiters, duplicate DM tool names,
  # XAML command bindings with no backing view model property) before any Windows runner
  # is provisioned. Previously this script existed but was never executed by CI.
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source structure
        run: python3 tools/validate_source.py

  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK
        run: dotnet --info

      - name: Restore app
        run: dotnet restore src/DungeonMasterAI.App/DungeonMasterAI.App.csproj

      - name: Build app
        run: dotnet build src/DungeonMasterAI.App/DungeonMasterAI.App.csproj --configuration Release --no-restore

      - name: Run AAA GUI construction smoke tests
        run: dotnet run --project tests/DungeonMasterAI.GuiSmokeTests/DungeonMasterAI.GuiSmokeTests.csproj --configuration Release

      - name: Upload real WPF GUI snapshots
        uses: actions/upload-artifact@v4
        with:
          name: DungeonMasterAI-gui-snapshots
          path: windows/artifacts/gui-snapshots/*.png

      - name: Run map schema migration and provenance tests
        run: dotnet run --project tests/DungeonMasterAI.MapSchemaProvenanceTests/DungeonMasterAI.MapSchemaProvenanceTests.csproj --configuration Release

      - name: Run focused roll-state tests
        run: dotnet run --project tests/DungeonMasterAI.RollTests/DungeonMasterAI.RollTests.csproj --configuration Release

      - name: Run Initiative roll tests
        run: dotnet run --project tests/DungeonMasterAI.InitiativeTests/DungeonMasterAI.InitiativeTests.csproj --configuration Release

      - name: Run Concentration roll tests
        run: dotnet run --project tests/DungeonMasterAI.ConcentrationTests/DungeonMasterAI.ConcentrationTests.csproj --configuration Release

      - name: Run spell attack roll tests
        run: dotnet run --project tests/DungeonMasterAI.SpellRollTests/DungeonMasterAI.SpellRollTests.csproj --configuration Release

      - name: Run projectile spell roll tests
        run: dotnet run --project tests/DungeonMasterAI.ProjectileRollTests/DungeonMasterAI.ProjectileRollTests.csproj --configuration Release

      - name: Run auto-projectile damage roll tests
        run: dotnet run --project tests/DungeonMasterAI.AutoProjectileRollTests/DungeonMasterAI.AutoProjectileRollTests.csproj --configuration Release

      - name: Run spell saving throw roll tests
        run: dotnet run --project tests/DungeonMasterAI.SpellSaveRollTests/DungeonMasterAI.SpellSaveRollTests.csproj --configuration Release

      - name: Run save-spell damage roll tests
        run: dotnet run --project tests/DungeonMasterAI.SaveSpellDamageRollTests/DungeonMasterAI.SaveSpellDamageRollTests.csproj --configuration Release

      - name: Run area spell roll tests
        run: dotnet run --project tests/DungeonMasterAI.AreaSpellRollTests/DungeonMasterAI.AreaSpellRollTests.csproj --configuration Release

      - name: Run r58 spell coverage tests
        run: dotnet run --project tests/DungeonMasterAI.R58SpellCoverageTests/DungeonMasterAI.R58SpellCoverageTests.csproj --configuration Release

      - name: Run combat skill roll tests
        run: dotnet run --project tests/DungeonMasterAI.CombatSkillRollTests/DungeonMasterAI.CombatSkillRollTests.csproj --configuration Release

      - name: Run stealth and first aid roll tests
        run: dotnet run --project tests/DungeonMasterAI.StealthAidRollTests/DungeonMasterAI.StealthAidRollTests.csproj --configuration Release

      - name: Run grapple shove and escape player roll tests
        run: dotnet run --project tests/DungeonMasterAI.UnarmedPlayerRollTests/DungeonMasterAI.UnarmedPlayerRollTests.csproj --configuration Release

      - name: Run player Opportunity Attack roll tests
        run: dotnet run --project tests/DungeonMasterAI.OpportunityAttackRollTests/DungeonMasterAI.OpportunityAttackRollTests.csproj --configuration Release

      - name: Run player readied attack roll tests
        run: dotnet run --project tests/DungeonMasterAI.ReadiedAttackRollTests/DungeonMasterAI.ReadiedAttackRollTests.csproj --configuration Release

      - name: Run readied reaction decision tests
        run: dotnet run --project tests/DungeonMasterAI.ReadiedDecisionTests/DungeonMasterAI.ReadiedDecisionTests.csproj --configuration Release

      - name: Run readied spell player-control tests
        run: dotnet run --project tests/DungeonMasterAI.ReadiedSpellRollTests/DungeonMasterAI.ReadiedSpellRollTests.csproj --configuration Release

      - name: Run readied projectile spell tests
        run: dotnet run --project tests/DungeonMasterAI.ReadiedProjectileSpellTests/DungeonMasterAI.ReadiedProjectileSpellTests.csproj --configuration Release

      - name: Run readied area spell tests
        run: dotnet run --project tests/DungeonMasterAI.ReadiedAreaSpellTests/DungeonMasterAI.ReadiedAreaSpellTests.csproj --configuration Release

      - name: Run readied multi-buff spell tests
        run: dotnet run --project tests/DungeonMasterAI.ReadiedMultiBuffTests/DungeonMasterAI.ReadiedMultiBuffTests.csproj --configuration Release

      - name: Run readied movement decision tests
        run: dotnet run --project tests/DungeonMasterAI.ReadiedMoveDecisionTests/DungeonMasterAI.ReadiedMoveDecisionTests.csproj --configuration Release

      - name: Run first-class player decision tests
        run: dotnet run --project tests/DungeonMasterAI.PlayerDecisionTests/DungeonMasterAI.PlayerDecisionTests.csproj --configuration Release

      - name: Run r62 progression and XP economy tests
        run: dotnet run --project tests/DungeonMasterAI.ProgressionTests/DungeonMasterAI.ProgressionTests.csproj --configuration Release

      - name: Run full smoke suite
        run: dotnet run --project tests/DungeonMasterAI.Smoke/DungeonMasterAI.Smoke.csproj --configuration Release -- ../reference-python/demo/sample_campaign_manifest.json

      - name: Publish self-contained Windows build
        run: >-
          dotnet publish src/DungeonMasterAI.App/DungeonMasterAI.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishReadyToRun=true
          -o artifacts/DungeonMasterAI-win-x64

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/DungeonMasterAI.iss'

      - name: Upload runnable build
        uses: actions/upload-artifact@v4
        with:
          name: DungeonMasterAI-win-x64
          path: windows/artifacts/DungeonMasterAI-win-x64

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DungeonMasterAI-installer
          path: windows/artifacts/installer/*.exe

  # The tactical map pipeline, r53 through r57. These were five separate workflow files, each
  # provisioning its own windows-latest runner and each performing a full restore and build of
  # the shared project graph to run a single test project. They are one job here because they
  # share that graph: one runner, one build, five suites, one combined artifact. Kept separate
  # from build-test-package so map failures stay legible and the two jobs run concurrently.
  map-pipeline:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run map schema and geometry tests (r53)
        run: dotnet run --project tests/DungeonMasterAI.MapGeometryTests/DungeonMasterAI.MapGeometryTests.csproj --configuration Release

      - name: Run high-quality map asset pack tests (r54)
        run: dotnet run --project tests/DungeonMasterAI.MapAssetTests/DungeonMasterAI.MapAssetTests.csproj --configuration Release

      - name: Run local AI tactical map generation contract tests (r55)
        run: dotnet run --project tests/DungeonMasterAI.AiMapGenerationTests/DungeonMasterAI.AiMapGenerationTests.csproj --configuration Release

      - name: Run production asset and Map Builder tests (r56)
        run: dotnet run --project tests/DungeonMasterAI.R56MapBuilderTests/DungeonMasterAI.R56MapBuilderTests.csproj --configuration Release

      - name: Run non-destructive map editing tests (r57)
        run: dotnet run --project tests/DungeonMasterAI.R57MapEditingTests/DungeonMasterAI.R57MapEditingTests.csproj --configuration Release

      - name: Run map-combat wiring and spawn-vocabulary tests (r62)
        run: dotnet run --project tests/DungeonMasterAI.R62MapCombatTests/DungeonMasterAI.R62MapCombatTests.csproj --configuration Release

      # One artifact instead of four. Rendered references from every revision are retained,
      # each under its own subdirectory, so visual regressions stay reviewable.
      - name: Upload rendered map references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DungeonMasterAI-map-pipeline
          path: |
            windows/artifacts/map-prototype/*.png
            windows/artifacts/map-assets/*.png
            windows/artifacts/r56-map-builder/*.png
            windows/artifacts/r57-map-editing/*.png
            windows/artifacts/r62-map-combat/*.png
