name: Apply r37 wiring

on:
  push:
    branches:
      - feature/r37-player-grapple-shove-rolls
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout r37
        uses: actions/checkout@v4
        with:
          ref: feature/r37-player-grapple-shove-rolls
          fetch-depth: 0

      - name: Wire grapple shove and escape player rolls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Guard the old automatic paths so a meaningful PC save/check cannot be silently rolled.
          engine_path = Path('windows/src/DungeonMasterAI.Engine/GameEngine.cs')
          engine = engine_path.read_text(encoding='utf-8')

          grapple_start = engine.index('    public GrappleResult ResolveUnarmedGrapple(')
          grapple_target = engine.index('        var target = RequireCharacter(campaign, targetCombatant.CharacterId);\n', grapple_start)
          grapple_insert_at = grapple_target + len('        var target = RequireCharacter(campaign, targetCombatant.CharacterId);\n')
          grapple_guard = '''        var previewSaveAbility = ChooseStrengthOrDexteritySave(target, targetSaveAbility);
          if (target.CharacterType.Equals("pc", StringComparison.OrdinalIgnoreCase)
              && !CharacterMechanics.AutomaticallyFailsSavingThrow(target, previewSaveAbility))
              throw new InvalidOperationException("Player-character Grapple saving throws must use the authoritative player-roll request path.");
          '''
          if 'Player-character Grapple saving throws must use the authoritative player-roll request path.' not in engine[grapple_start:grapple_start+4500]:
              engine = engine[:grapple_insert_at] + grapple_guard + engine[grapple_insert_at:]

          shove_start = engine.index('    public ShoveResult ResolveUnarmedShove(')
          shove_target = engine.index('        var target = RequireCharacter(campaign, targetCombatant.CharacterId);\n', shove_start)
          shove_insert_at = shove_target + len('        var target = RequireCharacter(campaign, targetCombatant.CharacterId);\n')
          shove_guard = '''        var previewSaveAbility = ChooseStrengthOrDexteritySave(target, targetSaveAbility);
          if (target.CharacterType.Equals("pc", StringComparison.OrdinalIgnoreCase)
              && !CharacterMechanics.AutomaticallyFailsSavingThrow(target, previewSaveAbility))
              throw new InvalidOperationException("Player-character Shove saving throws must use the authoritative player-roll request path.");
          '''
          if 'Player-character Shove saving throws must use the authoritative player-roll request path.' not in engine[shove_start:shove_start+4500]:
              engine = engine[:shove_insert_at] + shove_guard + engine[shove_insert_at:]

          escape_start = engine.index('    public EscapeGrappleResult EscapeGrapple(')
          escape_target = engine.index('        var target = RequireCharacter(campaign, targetCombatant.CharacterId);\n', escape_start)
          escape_insert_at = escape_target + len('        var target = RequireCharacter(campaign, targetCombatant.CharacterId);\n')
          escape_guard = '''        if (target.CharacterType.Equals("pc", StringComparison.OrdinalIgnoreCase))
              throw new InvalidOperationException("Player-character grapple escape checks must use the authoritative player-roll request path.");
          '''
          if 'Player-character grapple escape checks must use the authoritative player-roll request path.' not in engine[escape_start:escape_start+3000]:
              engine = engine[:escape_insert_at] + escape_guard + engine[escape_insert_at:]
          engine_path.write_text(engine, encoding='utf-8')

          # DM tool routing selects a pending player roll only when the target/escapee actually owns a meaningful die.
          router_path = Path('windows/src/DungeonMasterAI.Engine/DmToolRouter.cs')
          router = router_path.read_text(encoding='utf-8')
          router = router.replace(
              'Tool("unarmed_grapple", "Resolve the 2024 Unarmed Strike Grapple option. The target makes a Strength or Dexterity save against 8 + Strength modifier + Proficiency Bonus; a failure creates persistent Grappled state.",',
              'Tool("unarmed_grapple", "Resolve the 2024 Unarmed Strike Grapple option. The target makes a Strength or Dexterity save against 8 + Strength modifier + Proficiency Bonus. A player target receives a required player d20 prompt unless the save fails automatically.",', 1)
          router = router.replace(
              'Tool("unarmed_shove", "Resolve the 2024 Unarmed Strike Shove option, either knocking the target Prone or pushing it 5 feet after a failed Strength/Dexterity save.",',
              'Tool("unarmed_shove", "Resolve the 2024 Unarmed Strike Shove option, either knocking the target Prone or pushing it 5 feet after a failed Strength/Dexterity save. A player target owns that saving throw.",', 1)
          router = router.replace(
              'Tool("escape_grapple", "Spend the grappled creature\'s action to attempt escape using Athletics or Acrobatics against the stored escape DC.",',
              'Tool("escape_grapple", "Spend the grappled creature\'s action to attempt escape using Athletics or Acrobatics against the stored escape DC. A player character supplies the check d20 before the action resolves.",', 1)
          router = router.replace(
              '"unarmed_grapple" => engine.ResolveUnarmedGrapple(campaign, RequiredString(a, "encounter_id"), RequiredString(a, "attacker_combatant_id"), RequiredString(a, "target_combatant_id"), dice, OptionalString(a, "save_ability")),',
              '"unarmed_grapple" => ResolveUnarmedGrappleTool(engine, dice, campaign, a),', 1)
          router = router.replace(
              '"unarmed_shove" => engine.ResolveUnarmedShove(campaign, RequiredString(a, "encounter_id"), RequiredString(a, "attacker_combatant_id"), RequiredString(a, "target_combatant_id"), RequiredString(a, "effect"), dice, OptionalString(a, "save_ability")),',
              '"unarmed_shove" => ResolveUnarmedShoveTool(engine, dice, campaign, a),', 1)
          router = router.replace(
              '"escape_grapple" => engine.EscapeGrapple(campaign, RequiredString(a, "encounter_id"), RequiredString(a, "target_combatant_id"), RequiredString(a, "grappler_combatant_id"), RequiredString(a, "skill"), dice),',
              '"escape_grapple" => ResolveEscapeGrappleTool(engine, dice, campaign, a),', 1)
          router_path.write_text(router, encoding='utf-8')

          # Game Table universal d20 control resolves all three unarmed pending-roll types.
          vm_path = Path('windows/src/DungeonMasterAI.App/MainViewModel.PlayerRolls.cs')
          vm = vm_path.read_text(encoding='utf-8')
          if 'unarmed_grapple_save' not in vm:
              marker = '        if (pending.ResolutionKey.Equals("hide_check", StringComparison.OrdinalIgnoreCase))\n'
              insert = '''        if (pending.ResolutionKey.Equals("unarmed_grapple_save", StringComparison.OrdinalIgnoreCase))
          {
              await ResolveActiveUnarmedGrappleSaveFromRollAsync(pending.Id, rolls.RollOne, rolls.RollTwo);
              return;
          }

          if (pending.ResolutionKey.Equals("unarmed_shove_save", StringComparison.OrdinalIgnoreCase))
          {
              await ResolveActiveUnarmedShoveSaveFromRollAsync(pending.Id, rolls.RollOne, rolls.RollTwo);
              return;
          }

          if (pending.ResolutionKey.Equals("escape_grapple_check", StringComparison.OrdinalIgnoreCase))
          {
              await ResolveActiveEscapeGrappleFromRollAsync(pending.Id, rolls.RollOne, rolls.RollTwo);
              return;
          }

          '''
              if marker not in vm:
                  raise SystemExit('Could not find Hide dispatch marker in PlayerRolls.')
              vm = vm.replace(marker, insert + marker, 1)
              vm_path.write_text(vm, encoding='utf-8')
          PY

      - name: Commit r37 wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo "r37 wiring is already applied."
            exit 0
          fi
          git config user.name "countryboysplay"
          git config user.email "31964073+countryboysplay@users.noreply.github.com"
          git add windows/src/DungeonMasterAI.Engine/GameEngine.cs \
                  windows/src/DungeonMasterAI.Engine/DmToolRouter.cs \
                  windows/src/DungeonMasterAI.App/MainViewModel.PlayerRolls.cs
          git commit -m "r37: wire authoritative grapple shove and escape rolls"
          git push origin HEAD:feature/r37-player-grapple-shove-rolls
