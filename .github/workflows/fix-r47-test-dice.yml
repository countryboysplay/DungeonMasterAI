name: Fix r47 deterministic test dice

on:
  push:
    branches: [feature/r47-npc-readied-projectile-spells]
    paths:
      - '.github/workflows/fix-r47-test-dice.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r47-npc-readied-projectile-spells
          fetch-depth: 0
      - name: Correct exclusive maximum bound
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('windows/tests/DungeonMasterAI.ReadiedProjectileSpellTests/Program.cs')
          text = p.read_text(encoding='utf-8')
          old = 'static DiceService MaximumDice() => new((min, max) => max);'
          new = 'static DiceService MaximumDice() => new((min, max) => max - 1);'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one MaximumDice helper, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit test correction
        run: |
          git config user.name countryboysplay
          git config user.email 31964073+countryboysplay@users.noreply.github.com
          git add windows/tests/DungeonMasterAI.ReadiedProjectileSpellTests/Program.cs
          git diff --cached --check
          git commit -m "r47: correct deterministic maximum dice helper"
          git push origin HEAD:feature/r47-npc-readied-projectile-spells
