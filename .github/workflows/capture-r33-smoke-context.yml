name: Capture r33 smoke context

on:
  push:
    branches:
      - feature/r33-player-save-spell-damage
    paths:
      - .github/workflows/capture-r33-smoke-context.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture context
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('windows/tests/DungeonMasterAI.Smoke/Program.cs')
          lines = p.read_text(encoding='utf-8').splitlines()
          needle = 'upcast damaging spell adds one configured die for each slot above base'
          idx = next(i for i,l in enumerate(lines) if needle in l)
          start = max(0, idx - 25)
          end = min(len(lines), idx + 16)
          out = '\n'.join(f'{i+1}: {lines[i]}' for i in range(start,end)) + '\n'
          d = Path('.github/diagnostics')
          d.mkdir(parents=True, exist_ok=True)
          (d/'r33-smoke-context.txt').write_text(out, encoding='utf-8')
          PY
      - name: Commit captured context
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@local.invalid"
          git add .github/diagnostics/r33-smoke-context.txt
          git commit -m "ci: capture r33 smoke failure context"
          git push origin HEAD:${GITHUB_REF_NAME}
