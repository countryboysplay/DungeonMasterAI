name: Apply r34 wiring

on:
  push:
    branches:
      - feature/r34-player-area-spell-rolls
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout r34
        uses: actions/checkout@v4
        with:
          ref: feature/r34-player-area-spell-rolls
          fetch-depth: 0

      - name: Wire area spell sequence and migrate smoke fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1. Route deterministic area casting through the authoritative player-roll sequence.
          spell_path = Path('windows/src/DungeonMasterAI.Engine/Spellcasting.cs')
          spell = spell_path.read_text(encoding='utf-8')
          if 'return BeginPlayerAreaSpellSequence(' not in spell:
              method = spell.index('    public SpellCastResult CastAreaSpell(')
              start = spell.index('        var upcastLevels = Math.Max(0, castAtLevel - spell.Level);', method)
              end = spell.index('    private static bool AreaContains(', start)
              replacement = '''        return BeginPlayerAreaSpellSequence(
                  campaign,
                  caster,
                  spell,
                  castAtLevel,
                  spell.Level > 0,
                  spell.RequiresConcentration,
                  encounter,
                  pointX,
                  pointY,
                  direction,
                  affectedCombatants.Select(c => c.Id).ToArray(),
                  dice);
          }

          '''
              spell = spell[:start] + replacement + spell[end:]
              spell_path.write_text(spell, encoding='utf-8')

          # 2. Route the Game Table's universal roll button to the new area-save and shared-damage resolvers.
          vm_path = Path('windows/src/DungeonMasterAI.App/MainViewModel.PlayerRolls.cs')
          vm = vm_path.read_text(encoding='utf-8')
          if 'area_spell_damage' not in vm:
              marker = '        if (!pending.Formula.Equals("1d20", StringComparison.OrdinalIgnoreCase))\n'
              insert = '''        if (pending.ResolutionKey.Equals("area_spell_damage", StringComparison.OrdinalIgnoreCase))
          {
              var damageAmount = RollPendingSaveSpellDamage(pending);
              LastDiceResult = $"{pending.Formula}: {damageAmount}";
              await ResolveActiveAreaSpellDamageFromRollAsync(pending.Id, damageAmount);
              return;
          }

          '''
              if marker not in vm:
                  raise SystemExit('Could not find PlayerRolls damage dispatch marker.')
              vm = vm.replace(marker, insert + marker, 1)
          if 'area_spell_saving_throw' not in vm:
              marker = '        if (pending.ResolutionKey.Equals("saving_throw", StringComparison.OrdinalIgnoreCase))\n'
              insert = '''        if (pending.ResolutionKey.Equals("area_spell_saving_throw", StringComparison.OrdinalIgnoreCase))
          {
              await ResolveActiveAreaSpellSavingThrowFromRollAsync(pending.Id, rolls.RollOne, rolls.RollTwo);
              return;
          }

          '''
              if marker not in vm:
                  raise SystemExit('Could not find PlayerRolls d20 dispatch marker.')
              vm = vm.replace(marker, insert + marker, 1)
          vm_path.write_text(vm, encoding='utf-8')

          # 3. Migrate the broad smoke suite to the player-owned save-spell damage contract introduced in r33.
          smoke_path = Path('windows/tests/DungeonMasterAI.Smoke/Program.cs')
          smoke = smoke_path.read_text(encoding='utf-8')
          old = '''var scaledCantripCast = engine.CastSpell(campaign, spellTester.Id, scaledCantrip.Id, dice, cantripTarget.Id);
          Assert(scaledCantripCast.Damage?.Damage.RequestedDamage == 2, "a level 5 cantrip configured for standard damage scaling rolls two copies of its base damage expression");'''
          new = '''var scaledCantripCast = engine.CastSpell(campaign, spellTester.Id, scaledCantrip.Id, dice, cantripTarget.Id);
          Assert(scaledCantripCast.Damage is null && campaign.PendingPlayerRoll?.ResolutionKey == "spell_save_damage", "a level 5 player-cast save cantrip pauses for its scaled damage roll");
          var scaledCantripDamagePending = campaign.PendingPlayerRoll ?? throw new InvalidOperationException("Expected scaled cantrip damage roll.");
          var scaledCantripResolved = engine.ResolvePendingSpellSaveDamageRoll(campaign, scaledCantripDamagePending.Id, 2, dice);
          Assert(scaledCantripResolved.Damage?.Damage.RequestedDamage == 2, "a level 5 cantrip configured for standard damage scaling accepts the player-supplied two-copy damage total");'''
          if old in smoke:
              smoke = smoke.replace(old, new, 1)
          elif 'a level 5 player-cast save cantrip pauses for its scaled damage roll' not in smoke:
              raise SystemExit('Could not find stale scaled-cantrip smoke assertion.')

          # The legacy geometry block is intentionally an NPC-caster fixture. r34 has its own tests for player-owned area dice.
          old_caster = 'Name = "Area Caster", CharacterType = "pc", MaxHp = 100, CurrentHp = 100, ArmorClass = 14,'
          new_caster = 'Name = "Area Caster", CharacterType = "npc", MaxHp = 100, CurrentHp = 100, ArmorClass = 14,'
          if old_caster in smoke:
              smoke = smoke.replace(old_caster, new_caster, 1)
          elif new_caster not in smoke:
              raise SystemExit('Could not find area geometry caster fixture.')
          smoke_path.write_text(smoke, encoding='utf-8')
          PY

      - name: Commit wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo "r34 wiring is already applied."
            exit 0
          fi
          git config user.name "countryboysplay"
          git config user.email "31964073+countryboysplay@users.noreply.github.com"
          git add windows/src/DungeonMasterAI.Engine/Spellcasting.cs \
                  windows/src/DungeonMasterAI.App/MainViewModel.PlayerRolls.cs \
                  windows/tests/DungeonMasterAI.Smoke/Program.cs
          git commit -m "r34: wire authoritative area spell rolls"
          git push origin HEAD:feature/r34-player-area-spell-rolls
