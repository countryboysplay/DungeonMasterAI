name: Apply r41 Game Table routing

on:
  push:
    branches: [feature/r41-readied-reaction-player-choice]
    paths:
      - '.github/workflows/apply-r41-game-table-routing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r41-readied-reaction-player-choice
          fetch-depth: 0
      - name: Apply codemod
        run: python3 .github/scripts/apply_r41_game_table.py
      - name: Commit corrected Game Table routing
        run: |
          git config user.name countryboysplay
          git config user.email 31964073+countryboysplay@users.noreply.github.com
          git add windows/src/DungeonMasterAI.App/MainViewModel.cs
          git diff --cached --check
          git commit -m "r41: fix direct Game Table player-roll routing"
          git push origin HEAD:feature/r41-readied-reaction-player-choice
