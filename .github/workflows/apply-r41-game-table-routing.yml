            }

            var result = _engine.ResolveUnarmedShove(SelectedCampaign, SelectedEncounter.Id, SelectedAttacker.CombatantId, targetCombatant.Id, effect, _dice);
            await PresentCompletedGameTableActionAsync(result.Summary);
