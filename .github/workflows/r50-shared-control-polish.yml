name: Apply r50 shared control polish

on:
  push:
    branches:
      - feature/r50-aaa-gui
    paths:
      - .github/workflows/r50-shared-control-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r50-aaa-gui
          fetch-depth: 0
      - name: Add native dark-fantasy control chrome
        shell: python
        run: |
          from pathlib import Path

          path = Path('windows/src/DungeonMasterAI.App/Themes/AaaTheme.xaml')
          text = path.read_text(encoding='utf-8')
          marker = '<!-- r50-global-control-polish -->'
          if marker not in text:
              block = r'''
    <!-- r50-global-control-polish -->
    <Style TargetType="ToolTip">
        <Setter Property="Background" Value="#F20A0F12"/>
        <Setter Property="Foreground" Value="#E6DCC8"/>
        <Setter Property="BorderBrush" Value="#675234"/>
        <Setter Property="BorderThickness" Value="1"/>
        <Setter Property="Padding" Value="9,6"/>
        <Setter Property="FontSize" Value="11"/>
        <Setter Property="HasDropShadow" Value="True"/>
    </Style>

    <Style x:Key="AaaScrollThumb" TargetType="Thumb">
        <Setter Property="Background" Value="#4B4437"/>
        <Setter Property="MinWidth" Value="6"/>
        <Setter Property="MinHeight" Value="24"/>
        <Setter Property="Template">
            <Setter.Value>
                <ControlTemplate TargetType="Thumb">
                    <Border Background="{TemplateBinding Background}" CornerRadius="3" Margin="1"/>
                </ControlTemplate>
            </Setter.Value>
        </Setter>
        <Style.Triggers>
            <Trigger Property="IsMouseOver" Value="True"><Setter Property="Background" Value="#80673F"/></Trigger>
            <Trigger Property="IsDragging" Value="True"><Setter Property="Background" Value="#A88951"/></Trigger>
        </Style.Triggers>
    </Style>

    <Style TargetType="ScrollBar">
        <Setter Property="Background" Value="#090D0F"/>
        <Setter Property="Width" Value="9"/>
        <Setter Property="Height" Value="9"/>
        <Setter Property="Template">
            <Setter.Value>
                <ControlTemplate TargetType="ScrollBar">
                    <Grid Background="{TemplateBinding Background}" SnapsToDevicePixels="True">
                        <Track x:Name="PART_Track" IsDirectionReversed="True" Focusable="False">
                            <Track.Thumb><Thumb Style="{StaticResource AaaScrollThumb}"/></Track.Thumb>
                        </Track>
                    </Grid>
                    <ControlTemplate.Triggers>
                        <Trigger Property="Orientation" Value="Horizontal">
                            <Setter TargetName="PART_Track" Property="IsDirectionReversed" Value="False"/>
                        </Trigger>
                    </ControlTemplate.Triggers>
                </ControlTemplate>
            </Setter.Value>
        </Setter>
    </Style>

    <Style TargetType="RadioButton">
        <Setter Property="Foreground" Value="#C9C1B2"/>
        <Setter Property="FontSize" Value="10"/>
        <Setter Property="VerticalContentAlignment" Value="Center"/>
        <Setter Property="Template">
            <Setter.Value>
                <ControlTemplate TargetType="RadioButton">
                    <Border x:Name="Outer" Background="#D90A0F12" BorderBrush="#45433C" BorderThickness="1" CornerRadius="12" Padding="11,5" Margin="2">
                        <Grid>
                            <Grid.ColumnDefinitions><ColumnDefinition Width="13"/><ColumnDefinition Width="*"/></Grid.ColumnDefinitions>
                            <Ellipse x:Name="DotRing" Width="10" Height="10" Stroke="#736142" StrokeThickness="1" VerticalAlignment="Center"/>
                            <Ellipse x:Name="Dot" Width="5" Height="5" Fill="#5D91C0" VerticalAlignment="Center" Visibility="Collapsed"/>
                            <ContentPresenter Grid.Column="1" Margin="6,0,0,0" VerticalAlignment="Center"/>
                        </Grid>
                    </Border>
                    <ControlTemplate.Triggers>
                        <Trigger Property="IsChecked" Value="True">
                            <Setter TargetName="Outer" Property="Background" Value="#132A3D"/>
                            <Setter TargetName="Outer" Property="BorderBrush" Value="#436A8B"/>
                            <Setter TargetName="Dot" Property="Visibility" Value="Visible"/>
                            <Setter Property="Foreground" Value="#E1EBF3"/>
                        </Trigger>
                        <Trigger Property="IsMouseOver" Value="True"><Setter TargetName="Outer" Property="BorderBrush" Value="#8A6F42"/></Trigger>
                    </ControlTemplate.Triggers>
                </ControlTemplate>
            </Setter.Value>
        </Setter>
    </Style>

    <Style TargetType="Separator">
        <Setter Property="Background" Value="#3A3328"/>
        <Setter Property="Height" Value="1"/>
        <Setter Property="Margin" Value="0,6"/>
        <Setter Property="Template">
            <Setter.Value><ControlTemplate TargetType="Separator"><Border Background="{TemplateBinding Background}"/></ControlTemplate></Setter.Value>
        </Setter>
    </Style>
'''
              end = text.rfind('</ResourceDictionary>')
              if end < 0:
                  raise SystemExit('AaaTheme ResourceDictionary closing tag not found.')
              text = text[:end] + block + '\n' + text[end:]
              path.write_text(text, encoding='utf-8')

      - name: Commit shared control polish
        shell: bash
        run: |
          if git diff --quiet -- windows/src/DungeonMasterAI.App/Themes/AaaTheme.xaml; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "DungeonMasterAI CI"
          git config user.email "actions@users.noreply.github.com"
          git add windows/src/DungeonMasterAI.App/Themes/AaaTheme.xaml
          git commit -m "r50 ui: polish shared native controls"
          git push origin HEAD:feature/r50-aaa-gui
