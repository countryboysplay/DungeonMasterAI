name: R54 Map Assets

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  map-assets:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run high-quality map asset pack tests
        run: dotnet run --project tests/DungeonMasterAI.MapAssetTests/DungeonMasterAI.MapAssetTests.csproj --configuration Release

      - name: Upload asset-backed renderer reference
        uses: actions/upload-artifact@v4
        with:
          name: DungeonMasterAI-map-assets-r54
          path: windows/artifacts/map-assets/*.png
