name: Apply r39 move fix

on:
  push:
    branches: [feature/r39-player-decisions]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r39-player-decisions
          fetch-depth: 0
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('windows/src/DungeonMasterAI.Engine/GameEngine.cs')
          s = p.read_text(encoding='utf-8')
          marker = '            OpportunityAttacks = opportunityAttacks\n            };\n            Touch(campaign);'
          replacement = '            OpportunityAttacks = opportunityAttacks\n            };\n            SyncOpportunityAttackPlayerDecision(campaign, encounter);\n            Touch(campaign);'
          if marker in s:
              s = s.replace(marker, replacement, 1)
          else:
              start = s.index('        if (opportunityAttacks.Count > 0)')
              region = s[start:start+1200]
              if 'SyncOpportunityAttackPlayerDecision(campaign, encounter);' not in region:
                  touch = '            Touch(campaign);'
                  pos = s.index(touch, start)
                  s = s[:pos] + '            SyncOpportunityAttackPlayerDecision(campaign, encounter);\n' + s[pos:]
          p.write_text(s, encoding='utf-8')

          p = Path('windows/src/DungeonMasterAI.Engine/GameEngine.PlayerDecisions.cs')
          s = p.read_text(encoding='utf-8')
          dead = '''        // Any impossible PC windows above have been auto-declined. If no unresolved window remains,
          // finish the move now. Otherwise the remaining windows belong to NPCs and stay available to the DM runtime.
          if (pendingMove.OpportunityAttacks.All(x => x.Resolved))
              FinalizePendingMoveIfReady(campaign, encounter);
          '''
          if dead in s:
              s = s.replace(dead, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name countryboysplay
          git config user.email 31964073+countryboysplay@users.noreply.github.com
          git add windows/src/DungeonMasterAI.Engine/GameEngine.cs windows/src/DungeonMasterAI.Engine/GameEngine.PlayerDecisions.cs
          git commit -m "r39: surface player reaction decision when movement pauses"
          git push origin HEAD:feature/r39-player-decisions
