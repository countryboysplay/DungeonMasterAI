name: R53 Map Prototype

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  map-schema-renderer:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run map schema and renderer prototype tests
        run: dotnet run --project tests/DungeonMasterAI.MapRendererTests/DungeonMasterAI.MapRendererTests.csproj --configuration Release

      - name: Upload rendered ruined-crypt prototype
        uses: actions/upload-artifact@v4
        with:
          name: DungeonMasterAI-map-prototype
          path: windows/artifacts/map-prototype/*.png
