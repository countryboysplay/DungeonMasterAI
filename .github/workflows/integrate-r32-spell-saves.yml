name: Integrate r32 player spell saving throws

on:
  push:
    branches:
      - feature/r32-player-spell-save-rolls
    paths:
      - .github/workflows/integrate-r32-spell-saves.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate spell saving throw pipeline
        run: python3 .github/scripts/integrate-r32.py

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@local.invalid"
          git add windows
          git commit -m "r32: integrate player spell saving throws"
          git push origin HEAD:${GITHUB_REF_NAME}
