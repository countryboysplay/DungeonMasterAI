name: Finalize r40

on:
  push:
    branches: [feature/r40-game-table-player-inputs]
    paths:
      - '.github/workflows/finalize-r40.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-merge:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r40-game-table-player-inputs
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/DungeonMasterAI.App/DungeonMasterAI.App.csproj
      - name: Build WPF app
        run: dotnet build src/DungeonMasterAI.App/DungeonMasterAI.App.csproj --configuration Release --no-restore
      - name: Roll-state tests
        run: dotnet run --project tests/DungeonMasterAI.RollTests/DungeonMasterAI.RollTests.csproj --configuration Release
      - name: Initiative tests
        run: dotnet run --project tests/DungeonMasterAI.InitiativeTests/DungeonMasterAI.InitiativeTests.csproj --configuration Release
      - name: Concentration tests
        run: dotnet run --project tests/DungeonMasterAI.ConcentrationTests/DungeonMasterAI.ConcentrationTests.csproj --configuration Release
      - name: Spell attack tests
        run: dotnet run --project tests/DungeonMasterAI.SpellRollTests/DungeonMasterAI.SpellRollTests.csproj --configuration Release
      - name: Projectile tests
        run: dotnet run --project tests/DungeonMasterAI.ProjectileRollTests/DungeonMasterAI.ProjectileRollTests.csproj --configuration Release
      - name: Auto-projectile tests
        run: dotnet run --project tests/DungeonMasterAI.AutoProjectileRollTests/DungeonMasterAI.AutoProjectileRollTests.csproj --configuration Release
      - name: Spell save tests
        run: dotnet run --project tests/DungeonMasterAI.SpellSaveRollTests/DungeonMasterAI.SpellSaveRollTests.csproj --configuration Release
      - name: Save-spell damage tests
        run: dotnet run --project tests/DungeonMasterAI.SaveSpellDamageRollTests/DungeonMasterAI.SaveSpellDamageRollTests.csproj --configuration Release
      - name: Area-spell tests
        run: dotnet run --project tests/DungeonMasterAI.AreaSpellRollTests/DungeonMasterAI.AreaSpellRollTests.csproj --configuration Release
      - name: Combat-skill tests
        run: dotnet run --project tests/DungeonMasterAI.CombatSkillRollTests/DungeonMasterAI.CombatSkillRollTests.csproj --configuration Release
      - name: Stealth and first-aid tests
        run: dotnet run --project tests/DungeonMasterAI.StealthAidRollTests/DungeonMasterAI.StealthAidRollTests.csproj --configuration Release
      - name: Unarmed player-roll tests
        run: dotnet run --project tests/DungeonMasterAI.UnarmedPlayerRollTests/DungeonMasterAI.UnarmedPlayerRollTests.csproj --configuration Release
      - name: Opportunity Attack tests
        run: dotnet run --project tests/DungeonMasterAI.OpportunityAttackRollTests/DungeonMasterAI.OpportunityAttackRollTests.csproj --configuration Release
      - name: Player decision tests
        run: dotnet run --project tests/DungeonMasterAI.PlayerDecisionTests/DungeonMasterAI.PlayerDecisionTests.csproj --configuration Release
      - name: Full smoke suite
        run: dotnet run --project tests/DungeonMasterAI.Smoke/DungeonMasterAI.Smoke.csproj --configuration Release -- ../reference-python/demo/sample_campaign_manifest.json
      - name: Publish self-contained Windows build
        run: >-
          dotnet publish src/DungeonMasterAI.App/DungeonMasterAI.App.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=false -p:PublishReadyToRun=true
          -o artifacts/DungeonMasterAI-win-x64
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/DungeonMasterAI.iss'
      - name: Clean temporary r40 integration files and merge
        working-directory: .
        shell: pwsh
        run: |
          git config user.name countryboysplay
          git config user.email 31964073+countryboysplay@users.noreply.github.com
          $paths = @(
            '.github/workflows/apply-r40-game-table-wiring.yml',
            '.github/workflows/verify-r40-and-mark.yml',
            '.github/workflows/verify-r40-status.yml',
            '.github/workflows/finalize-r40.yml',
            '.github/ci-triggers/r40-game-table.txt',
            '.github/ci-triggers/r40-verified.txt',
            '.github/ci-results/r40-status.txt'
          )
          foreach ($path in $paths) {
            if (Test-Path $path) { git rm -f -- $path }
          }
          git commit -m "r40: route Game Table controls through authoritative player input" || echo "No temporary r40 files remained."
          git push origin HEAD:feature/r40-game-table-player-inputs
          git push origin HEAD:main
