name: Apply r36 wiring

on:
  push:
    branches:
      - feature/r36-player-stealth-aid-rolls
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout r36
        uses: actions/checkout@v4
        with:
          ref: feature/r36-player-stealth-aid-rolls
          fetch-depth: 0

      - name: Wire stealth and first aid player rolls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Prevent engine callers from silently rolling player Hide and hidden-Search checks.
          stealth_path = Path('windows/src/DungeonMasterAI.Engine/StealthReady.cs')
          stealth = stealth_path.read_text(encoding='utf-8')
          hide_start = stealth.index('    public HideResult TakeHide(')
          hide_character = stealth.index('        var character = RequireCharacter(campaign, combatant.CharacterId);\n', hide_start)
          hide_insert_at = hide_character + len('        var character = RequireCharacter(campaign, combatant.CharacterId);\n')
          hide_guard = '''        if (character.CharacterType.Equals("pc", StringComparison.OrdinalIgnoreCase))
              throw new InvalidOperationException("Player-character Hide checks must use the authoritative player-roll request path.");
          '''
          if 'Player-character Hide checks must use the authoritative player-roll request path.' not in stealth[hide_start:hide_start+2500]:
              stealth = stealth[:hide_insert_at] + hide_guard + stealth[hide_insert_at:]

          search_start = stealth.index('    public HiddenSearchResult SearchForHiddenCombatant(')
          search_character = stealth.index('        var searcher = RequireCharacter(campaign, searcherCombatant.CharacterId);\n', search_start)
          search_insert_at = search_character + len('        var searcher = RequireCharacter(campaign, searcherCombatant.CharacterId);\n')
          search_guard = '''        if (searcher.CharacterType.Equals("pc", StringComparison.OrdinalIgnoreCase))
              throw new InvalidOperationException("Player-character hidden Search checks must use the authoritative player-roll request path.");
          '''
          if 'Player-character hidden Search checks must use the authoritative player-roll request path.' not in stealth[search_start:search_start+2500]:
              stealth = stealth[:search_insert_at] + search_guard + stealth[search_insert_at:]
          stealth_path.write_text(stealth, encoding='utf-8')

          # Prevent direct PC First Aid from bypassing the pending-roll path.
          engine_path = Path('windows/src/DungeonMasterAI.Engine/GameEngine.cs')
          engine = engine_path.read_text(encoding='utf-8')
          aid_start = engine.index('    public FirstAidResult TakeFirstAid(')
          aid_character = engine.index('        var helper = RequireCharacter(campaign, helperCombatant.CharacterId);\n', aid_start)
          aid_insert_at = aid_character + len('        var helper = RequireCharacter(campaign, helperCombatant.CharacterId);\n')
          aid_guard = '''        if (helper.CharacterType.Equals("pc", StringComparison.OrdinalIgnoreCase))
              throw new InvalidOperationException("Player-character First Aid checks must use the authoritative player-roll request path.");
          '''
          if 'Player-character First Aid checks must use the authoritative player-roll request path.' not in engine[aid_start:aid_start+3000]:
              engine = engine[:aid_insert_at] + aid_guard + engine[aid_insert_at:]
          engine_path.write_text(engine, encoding='utf-8')

          # Route DM tools based on whether the actor who owns the die is a PC.
          router_path = Path('windows/src/DungeonMasterAI.Engine/DmToolRouter.cs')
          router = router_path.read_text(encoding='utf-8')
          router = router.replace(
              'Tool("take_hide", "Take the 2024 Hide action. The engine requires heavy obscurement or sufficient cover, verifies enemies lack line of sight, rolls DC 15 Dexterity (Stealth), and records the Perception DC on success.",',
              'Tool("take_hide", "Take the 2024 Hide action. The engine validates concealment and line of sight. NPC Stealth resolves immediately; a player character creates a required Dexterity (Stealth) d20 roll and pauses until the Game Table supplies it.",', 1)
          router = router.replace(
              'Tool("search_hidden", "Use the Search action with Wisdom (Perception) against a selected hidden combatant\'s recorded Hide total. A success ends that combatant\'s hidden state.",',
              'Tool("search_hidden", "Use the Search action with Wisdom (Perception) against a selected hidden combatant\'s recorded Hide total. NPC Search resolves immediately; a player character creates a required d20 roll and pauses until the Game Table supplies it.",', 1)
          router = router.replace(
              'Tool("first_aid", "Use the Help action to administer first aid with a DC 10 Wisdom (Medicine) check, stabilizing a living creature at 0 HP or ending a nonlethal Unconscious condition on success.",',
              'Tool("first_aid", "Use the Help action to administer first aid with a DC 10 Wisdom (Medicine) check. NPC checks resolve immediately; a player character creates a required d20 roll before stabilization or awakening can occur.",', 1)
          router = router.replace(
              '"take_hide" => engine.TakeHide(campaign, RequiredString(a, "encounter_id"), RequiredString(a, "combatant_id"), dice),',
              '"take_hide" => ResolveHideTool(engine, dice, campaign, a),', 1)
          router = router.replace(
              '"search_hidden" => engine.SearchForHiddenCombatant(campaign, RequiredString(a, "encounter_id"), RequiredString(a, "searcher_combatant_id"), RequiredString(a, "target_combatant_id"), dice),',
              '"search_hidden" => ResolveHiddenSearchTool(engine, dice, campaign, a),', 1)
          router = router.replace(
              '"first_aid" => engine.TakeFirstAid(campaign, RequiredString(a, "encounter_id"), RequiredString(a, "helper_combatant_id"), RequiredString(a, "target_combatant_id"), dice),',
              '"first_aid" => ResolveFirstAidTool(engine, dice, campaign, a),', 1)
          router_path.write_text(router, encoding='utf-8')

          # Universal Game Table roll button resolves all three new pending-roll types.
          vm_path = Path('windows/src/DungeonMasterAI.App/MainViewModel.PlayerRolls.cs')
          vm = vm_path.read_text(encoding='utf-8')
          if 'hide_check' not in vm:
              marker = '        if (pending.ResolutionKey.Equals("combat_skill_action", StringComparison.OrdinalIgnoreCase))\n'
              insert = '''        if (pending.ResolutionKey.Equals("hide_check", StringComparison.OrdinalIgnoreCase))
          {
              await ResolveActiveHideFromRollAsync(pending.Id, rolls.RollOne, rolls.RollTwo);
              return;
          }

          if (pending.ResolutionKey.Equals("search_hidden_check", StringComparison.OrdinalIgnoreCase))
          {
              await ResolveActiveHiddenSearchFromRollAsync(pending.Id, rolls.RollOne, rolls.RollTwo);
              return;
          }

          if (pending.ResolutionKey.Equals("first_aid_check", StringComparison.OrdinalIgnoreCase))
          {
              await ResolveActiveFirstAidFromRollAsync(pending.Id, rolls.RollOne, rolls.RollTwo);
              return;
          }

          '''
              if marker not in vm:
                  raise SystemExit('Could not find combat-skill dispatch marker in PlayerRolls.')
              vm = vm.replace(marker, insert + marker, 1)
              vm_path.write_text(vm, encoding='utf-8')

          # Migrate broad smoke PC fixtures to explicitly satisfy the authoritative pending roll.
          smoke_path = Path('windows/tests/DungeonMasterAI.Smoke/Program.cs')
          smoke = smoke_path.read_text(encoding='utf-8')
          old = 'var aidResult = engine.TakeFirstAid(campaign, aidEncounter.Id, medicCombatant.Id, fallenCombatant.Id, dice);'
          new = '''var aidPending = engine.RequestFirstAidRoll(campaign, aidEncounter.Id, medicCombatant.Id, fallenCombatant.Id);
          Assert(medicCombatant.ActionAvailable && campaign.PendingPlayerRoll?.Id == aidPending.Id, "player First Aid pauses before spending the helper action");
          var aidResult = engine.ResolvePendingFirstAidRoll(campaign, aidPending.Id, 20);'''
          if old in smoke:
              smoke = smoke.replace(old, new, 1)

          old = 'var hideResult = engine.TakeHide(campaign, stealthEncounter.Id, stealthHeroCombatant.Id, dice);'
          new = '''var hidePending = engine.RequestHideRoll(campaign, stealthEncounter.Id, stealthHeroCombatant.Id);
          Assert(stealthHeroCombatant.ActionAvailable && campaign.PendingPlayerRoll?.Id == hidePending.Id, "player Hide pauses before spending the action");
          var hideResult = engine.ResolvePendingHideRoll(campaign, hidePending.Id, 20);'''
          if old in smoke:
              smoke = smoke.replace(old, new, 1)

          old = 'engine.TakeHide(campaign, hiddenAttackEncounter.Id, hiddenAttacker.Id, dice);'
          new = '''var hiddenAttackHidePending = engine.RequestHideRoll(campaign, hiddenAttackEncounter.Id, hiddenAttacker.Id);
          engine.ResolvePendingHideRoll(campaign, hiddenAttackHidePending.Id, 20);'''
          if old in smoke:
              smoke = smoke.replace(old, new, 1)
          smoke_path.write_text(smoke, encoding='utf-8')
          PY

      - name: Commit r36 wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo "r36 wiring is already applied."
            exit 0
          fi
          git config user.name "countryboysplay"
          git config user.email "31964073+countryboysplay@users.noreply.github.com"
          git add windows/src/DungeonMasterAI.Engine/StealthReady.cs \
                  windows/src/DungeonMasterAI.Engine/GameEngine.cs \
                  windows/src/DungeonMasterAI.Engine/DmToolRouter.cs \
                  windows/src/DungeonMasterAI.App/MainViewModel.PlayerRolls.cs \
                  windows/tests/DungeonMasterAI.Smoke/Program.cs
          git commit -m "r36: wire authoritative stealth and first aid rolls"
          git push origin HEAD:feature/r36-player-stealth-aid-rolls
