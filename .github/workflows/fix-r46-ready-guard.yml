name: Fix r46 Ready guard

on:
  push:
    branches: [feature/r46-readied-area-spells]
    paths:
      - '.github/workflows/fix-r46-ready-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r46-readied-area-spells
          fetch-depth: 0
      - name: Allow area-save spells through Ready
        run: python3 .github/scripts/fix_r46_ready_guard.py
      - name: Commit guard fix
        run: |
          git config user.name countryboysplay
          git config user.email 31964073+countryboysplay@users.noreply.github.com
          git add windows/src/DungeonMasterAI.Engine/Spellcasting.cs
          git diff --cached --check
          git commit -m "r46: allow area-save spells through Ready"
          git push origin HEAD:feature/r46-readied-area-spells
