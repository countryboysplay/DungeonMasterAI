name: Fix r46 Ready guard

on:
  push:
    branches: [feature/r46-readied-area-spells]
    paths:
      - '.github/workflows/fix-r46-ready-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r46-readied-area-spells
          fetch-depth: 0
      - name: Allow area-save spells through Ready
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('windows/src/DungeonMasterAI.Engine/Spellcasting.cs')
          text = p.read_text(encoding='utf-8')
          old = '''        if (resolution is "area_save" or "multi_buff" or "persistent_area")
              throw new InvalidOperationException($"Readying {spell.Name}'s area or multi-target resolution is not implemented yet. Cast it normally; the engine will not partially resolve an unsupported Ready interaction.");
'''
          new = '''        if (resolution is "multi_buff" or "persistent_area")
              throw new InvalidOperationException($"Readying {spell.Name}'s multi-target or persistent-area resolution is not implemented yet. Cast it normally; the engine will not partially resolve an unsupported Ready interaction.");
'''
          if old not in text:
              raise SystemExit('Stale area-save Ready guard was not found.')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit guard fix
        run: |
          git config user.name countryboysplay
          git config user.email 31964073+countryboysplay@users.noreply.github.com
          git add windows/src/DungeonMasterAI.Engine/Spellcasting.cs
          git diff --cached --check
          git commit -m "r46: allow area-save spells through Ready"
          git push origin HEAD:feature/r46-readied-area-spells
